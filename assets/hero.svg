<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hero-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E1B" />
      <stop offset="50%" stop-color="#0A1B33" />
      <stop offset="100%" stop-color="#071426" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="hero-radial-cyan" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#071426" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="hero-radial-corner" cx="90%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#071426" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Linear Underline -->
    <linearGradient id="hero-underline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.1" />
    </linearGradient>

    <!-- Technical Blueprint Grid Pattern -->
    <pattern id="hero-tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563EB" stroke-width="0.75" stroke-opacity="0.12" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="hero-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="hero-light-pulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Style for Animations -->
    <style>
      .orbit-spin-slow {
        transform-origin: 980px 210px;
        animation: rotateCW 40s linear infinite;
      }
      .orbit-spin-reverse {
        transform-origin: 980px 210px;
        animation: rotateCCW 28s linear infinite;
      }
      .orbit-left-spin {
        transform-origin: 220px 210px;
        animation: rotateCW 35s linear infinite;
      }
      .wave-path-pulse {
        stroke-dasharray: 200 400;
        animation: dashMove 12s linear infinite;
      }
      .glow-pulse {
        animation: pulseFade 4s ease-in-out infinite;
      }
      .sparkle {
        animation: twinkle 3s ease-in-out infinite;
      }

      @keyframes rotateCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1200; }
      }
      @keyframes pulseFade {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
    </style>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1200" height="420" fill="url(#hero-bg-grad)" rx="14" />
  <rect width="1200" height="420" fill="url(#hero-tech-grid)" rx="14" />
  <rect width="1200" height="420" fill="url(#hero-radial-cyan)" rx="14" />
  <rect width="1200" height="420" fill="url(#hero-radial-corner)" rx="14" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="13" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.35" />
  <rect x="8" y="8" width="1184" height="404" rx="10" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.15" />

  <!-- 2. Technical HUD Corner Markers -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.65">
    <!-- Top-Left -->
    <path d="M 24 38 L 24 24 L 38 24" fill="none" />
    <circle cx="24" cy="24" r="2" fill="#22D3EE" />
    <!-- Top-Right -->
    <path d="M 1176 38 L 1176 24 L 1162 24" fill="none" />
    <circle cx="1176" cy="24" r="2" fill="#22D3EE" />
    <!-- Bottom-Left -->
    <path d="M 24 382 L 24 396 L 38 396" fill="none" />
    <circle cx="24" cy="396" r="2" fill="#22D3EE" />
    <!-- Bottom-Right -->
    <path d="M 1176 382 L 1176 396 L 1162 396" fill="none" />
    <circle cx="1176" cy="396" r="2" fill="#22D3EE" />
  </g>

  <!-- Technical Coordinate Marks -->
  <g font-family="ui-monospace, monospace" font-size="9" fill="#38BDF8" opacity="0.5" letter-spacing="1">
    <text x="44" y="32">SYS_ID: 9520 // PUNE_IN [18.5204° N, 73.8567° E]</text>
    <text x="1000" y="32">NODE: SEC_YR // MIT_AOE</text>
    <text x="44" y="394">CORE: AI_ML // FULL_STACK_DEV</text>
    <text x="1040" y="394">STATUS: ACTIVE ●</text>
  </g>

  <!-- 3. Left Orbital Geometry (Restrained Technical Geometry) -->
  <g class="orbit-left-spin" opacity="0.25">
    <circle cx="220" cy="210" r="140" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="220" cy="210" r="95" fill="none" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="80" y1="210" x2="360" y2="210" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="2 6" />
    <line x1="220" y1="70" x2="220" y2="350" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="2 6" />
  </g>

  <!-- 4. Right Orbital Geometry (Celestial / Physics Geometry) -->
  <g opacity="0.45">
    <!-- Center Target Node -->
    <circle cx="980" cy="210" r="4" fill="#22D3EE" filter="url(#hero-glow)" />
    <circle cx="980" cy="210" r="18" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 4" />

    <!-- Spinning Ring 1 -->
    <g class="orbit-spin-slow">
      <circle cx="980" cy="210" r="160" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="6 14 2 14" />
      <circle cx="1140" cy="210" r="4.5" fill="#38BDF8" filter="url(#hero-glow)" />
      <circle cx="820" cy="210" r="3" fill="#22D3EE" />
    </g>

    <!-- Spinning Ring 2 (Counter-Clockwise) -->
    <g class="orbit-spin-reverse">
      <circle cx="980" cy="210" r="110" fill="none" stroke="#38BDF8" stroke-width="0.9" stroke-dasharray="12 18" />
      <circle cx="980" cy="100" r="3.5" fill="#22D3EE" filter="url(#hero-glow)" />
      <circle cx="980" cy="320" r="2.5" fill="#2563EB" />
    </g>

    <!-- Diagonal Coordinate Crosshairs -->
    <line x1="870" y1="100" x2="1090" y2="320" stroke="#2563EB" stroke-width="0.6" stroke-dasharray="4 8" opacity="0.4" />
    <line x1="870" y1="320" x2="1090" y2="100" stroke="#2563EB" stroke-width="0.6" stroke-dasharray="4 8" opacity="0.4" />
  </g>

  <!-- 5. Animated Mathematical Wave Path (SMIL Moving Light Pulse) -->
  <g opacity="0.65">
    <!-- Static Base Path -->
    <path d="M 0 310 Q 300 240 600 300 T 1200 280" fill="none" stroke="#2563EB" stroke-width="1.2" opacity="0.3" />
    
    <!-- Animated Light Pulse Line -->
    <path class="wave-path-pulse" d="M 0 310 Q 300 240 600 300 T 1200 280" fill="none" stroke="#22D3EE" stroke-width="2.5" filter="url(#hero-light-pulse)">
      <animate attributeName="stroke-dashoffset" from="0" to="-1200" dur="8s" repeatCount="indefinite" />
    </path>
    
    <path d="M 0 330 C 250 370 450 270 700 310 S 1100 340 1200 320" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 10" opacity="0.35" />
  </g>

  <!-- 6. Central Brand Content -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <g transform="translate(600, 115)">
      <rect x="-170" y="-16" width="340" height="30" rx="15" fill="#0A1B33" stroke="#2563EB" stroke-width="1.2" />
      <circle cx="-145" cy="-1" r="3.5" fill="#22D3EE" filter="url(#hero-glow)" />
      <text x="10" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="2.5">
        ENGINEERING &amp; RESEARCH PROFILE
      </text>
    </g>

    <!-- Candidate Name -->
    <text x="600" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" fill="#F8FAFC" letter-spacing="4">
      SIDDHARTH KUMBHAR
    </text>

    <!-- Glowing Vector Underline -->
    <rect class="glow-pulse" x="380" y="218" width="440" height="3.5" rx="1.75" fill="url(#hero-underline-grad)" filter="url(#hero-light-pulse)" />
    <circle cx="600" cy="219.75" r="3" fill="#F8FAFC" filter="url(#hero-glow)" />

    <!-- Role Line -->
    <text x="600" y="260" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#38BDF8" letter-spacing="3.5">
      AI/ML ENGINEERING STUDENT  |  SOFTWARE DEVELOPER
    </text>

    <!-- Institution Line -->
    <text x="600" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" letter-spacing="1.5">
      MIT ACADEMY OF ENGINEERING, PUNE
    </text>

    <!-- Core Technology Chips (SVG Inline Chips) -->
    <g transform="translate(600, 345)" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#E0F2FE">
      <!-- Chip 1 -->
      <g transform="translate(-270, 0)">
        <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#0A1B33" stroke="#2563EB" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle">AI &amp; ML SYSTEMS</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(-90, 0)">
        <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#0A1B33" stroke="#2563EB" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle">DEEP LEARNING</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(90, 0)">
        <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#0A1B33" stroke="#2563EB" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle">FULL-STACK</text>
      </g>
      <!-- Chip 4 -->
      <g transform="translate(270, 0)">
        <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#0A1B33" stroke="#2563EB" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle">SYSTEMS &amp; MANIM</text>
      </g>
    </g>
  </g>
</svg>

